# Serves the VERITAS frontend and proxies the API on the same origin.
#
# nginx rule: a location that declares any add_header inherits none from the server
# block. Headers are therefore declared per location, deliberately:
#   - API/health/ready: nothing added; the backend sets its own security headers
#     (CSP default-src 'none', nosniff, DENY, no-referrer, COOP/CORP, no-store).
#   - application shell: the full document policy below.
#   - hashed assets: long-lived caching plus nosniff.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    location ~ ^/(api/|health$|ready$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Server;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the application shell.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}

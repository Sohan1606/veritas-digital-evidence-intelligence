name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: veritas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veritas -d veritas_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERITAS_TEST_DATABASE_URL: postgresql+psycopg://veritas:ci-only-password@127.0.0.1:5432/veritas_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app tests
      - name: Migrations apply cleanly and seed is idempotent
        env:
          VERITAS_ENVIRONMENT: development
          VERITAS_DATABASE_URL: ${{ env.VERITAS_TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.seed
          alembic downgrade base
      - run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "pytest>=8.4,<10" "ruff>=0.13,<1.0"
      - run: ruff check --config backend/pyproject.toml tests scripts/qa
      - run: ruff format --check --config backend/pyproject.toml tests scripts/qa
      - run: pytest -q tests

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/backend.Dockerfile -t veritas-backend:ci .
      - run: docker build -f docker/frontend.Dockerfile -t veritas-web:ci .
